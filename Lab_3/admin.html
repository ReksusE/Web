<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coursely | Adimin-panel</title>
  <link rel="icon" type="image/jpg" href="./Image/favicon.jpg">
  <link rel="stylesheet" href="/CSS/style.css">
  <link rel="stylesheet" href="/CSS/admin.css">
</head>
<body>
  <header class="wrapper--coursely">
    <div class="container--small header--coursely">
      <a href="index.html" class="header--logo"><img src="./Image/Logo.png" alt="Coursely" class="header--logo--image"></a>
      <h1 class="header--title">Управление контентом</h1>
      <button class="header--button"><a href="index.html">На главную</a></button>
    </div>
  </header>

  <main class="container--small admin">
    <div id="admin-access-block" class="admin__block--hidden"></div>
    <nav class="admin__tabs">
      <button class="admin__tab admin__tab--active" data-tab="courses">📦 Курсы</button>
      <button class="admin__tab" data-tab="feedback">💬 Отзывы</button>
    </nav>

    <!-- Управление курсами -->
    <section id="tab-courses" class="admin__tab-content admin__tab-content--active">
      <!-- Кнопка вызова -->
      <div class="admin__controls" style="margin-bottom: 20px;">
        <button id="open-modal-btn" class="admin__btn--primary admin__btn--primary--active">+ Добавить курс</button>
      </div>

      <!-- Модальное окно -->
      <div id="course-modal" class="modal" style="display: none;">
          <div class="modal__content">
              <span class="modal__close">&times;</span>
              <h2>Редактирование курса</h2>
              <form id="course-form" class="admin__form">
                  <input type="hidden" id="course-id">
                  <div class="admin__grid">
                      <div class="admin__field">
                          <label class="admin__label">Название</label>
                          <input type="text" id="course-title" class="admin__input" required>
                      </div>
                      <div class="admin__field">
                          <label class="admin__label">Цена</label>
                          <input type="number" id="course-price" class="admin__input" required>
                      </div>
                      <div class="admin__field">
                          <label class="admin__label">Категория</label>
                          <select id="course-category" class="admin__input">
                              <option value="Audio">Audio</option>
                              <option value="Video">Video</option>
                              <option value="Design">Design</option>
                              <option value="Marketing">Marketing</option>
                          </select>
                      </div>
                  </div>
                  <div class="admin__field">
                      <label class="admin__label">Описание</label>
                      <textarea id="course-desc" class="admin__input admin__input--full" rows="4"></textarea>
                  </div>
                  <div class="admin__field">
                      <label class="admin__label">URL изображения</label>
                      <input type="text" id="course-img" class="admin__input">
                  </div>
                  <div class="admin__actions">
                      <button type="submit" id="btn-save-course" class="admin__btn--primary">Сохранить</button>
                      <button type="button" id="btn-reset-course" class="admin__btn--secondary">Очистить</button>
                  </div>
              </form>
          </div>
      </div>

      <div class="admin__table-wrapper">
        <table class="admin__table">
          <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>Действия</th></tr></thead>
          <tbody id="courses-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Управление отзывами -->
    <section id="tab-feedback" class="admin__tab-content">
      <div class="admin__filters">
        <input type="text" id="filter-user" class="admin__input" placeholder="Фильтр по ID пользователя">
        <input type="text" id="filter-course" class="admin__input" placeholder="Фильтр по ID курса">
      </div>
      <div class="admin__table-wrapper">
        <table class="admin__table">
          <thead><tr><th>ID</th><th>Пользователь</th><th>Курс</th><th>Дата</th><th>Текст</th><th></th></tr></thead>
          <tbody id="feedback-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/JavaScript/admin.js"></script>
</body>
</html>
